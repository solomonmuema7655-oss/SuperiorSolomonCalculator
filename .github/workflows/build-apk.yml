name: Build Superior Solomon Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Cache system dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Verify project files
        run: |
          echo "=== Workspace Information ==="
          echo "Workspace: $GITHUB_WORKSPACE"
          echo ""
          echo "=== Project Files ==="
          ls -lah "$GITHUB_WORKSPACE"
          echo ""
          echo "=== Verifying main.py ==="
          if [ -f "$GITHUB_WORKSPACE/main.py" ]; then
            echo "✓ main.py found successfully"
            wc -l "$GITHUB_WORKSPACE/main.py"
          else
            echo "✗ ERROR: main.py not found"
            exit 1
          fi
          echo ""
          echo "=== Verifying buildozer.spec ==="
          if [ -f "$GITHUB_WORKSPACE/buildozer.spec" ]; then
            echo "✓ buildozer.spec found successfully"
          else
            echo "✗ ERROR: buildozer.spec not found"
            exit 1
          fi

      - name: Create buildozer.spec
        run: |
          cat > "$GITHUB_WORKSPACE/buildozer.spec" <<'EOF'
          [app]

          title = Superior Solomon Scientific Calculator
          package.name = superiorsolomoncalculator
          package.domain = com.siyomacodingprograms

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas

          version = 0.1

          requirements = python3,kivy

          orientation = portrait
          fullscreen = 0

          android.api = 35
          android.minapi = 21
          android.ndk = 28c
          android.ndk_api = 21

          android.archs = arm64-v8a

          p4a.bootstrap = sdl2

          android.allow_backup = True

          android.permissions = INTERNET

          log_level = 2
          EOF

          echo "✓ buildozer.spec created successfully"

      - name: Clean Buildozer cache
        run: |
          echo "Cleaning previous build artifacts..."
          rm -rf "$GITHUB_WORKSPACE/.buildozer"
          rm -rf "$GITHUB_WORKSPACE/bin"
          echo "✓ Cache cleaned"

      - name: Download Android NDK
        run: |
          echo "Setting up Android NDK environment..."
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK_ROOT=$HOME/android-ndk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Starting APK Build ==="
          echo "Build timestamp: $(date)"
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "✗ Build failed with status code: $BUILD_STATUS"
            echo ""
            echo "=== Build Log (Last 100 lines) ==="
            tail -100 build.log
            exit 1
          fi
          
          echo "✓ Build completed successfully"

      - name: Find APK
        if: success()
        run: |
          echo "=== Searching for generated APK ==="
          APK_PATH=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print)
          
          if [ -z "$APK_PATH" ]; then
            echo "✗ ERROR: No APK file found"
            find "$GITHUB_WORKSPACE/bin" -type f 2>/dev/null || echo "bin directory not found"
            exit 1
          fi
          
          echo "✓ APK found:"
          echo "$APK_PATH"
          
          echo ""
          echo "=== APK Details ==="
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK
        if: success()
        uses
