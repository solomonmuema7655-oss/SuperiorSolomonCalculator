name: Build Android APK 

on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]
workflow_dispatch: 

jobs:
build-android:
runs-on: ubuntu-22.04 

steps:

* name: Checkout Code
uses: actions/checkout@v4
* name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'
* name: Install System Dependencies
run: |
sudo apt-get update
sudo apt-get install -y 
build-essential 
ccache 
git 
libffi-dev 
libssl-dev 
openjdk-17-jdk 
python3-pip 
python3-setuptools 
unzip 
zip 
zlib1g-dev
* name: Cache Buildozer Global Directory
uses: actions/cache@v4
with:
path: ~/.buildozer
key: 

runner.os−buildozer−r u n n e r point o s minus b u i l d o z e r minus
𝑟𝑢𝑛𝑛𝑒𝑟.𝑜𝑠−𝑏𝑢𝑖𝑙𝑑𝑜𝑧𝑒𝑟−
{{ hashFiles('buildozer.spec') }}
restore-keys: |
${{ runner.os }}-buildozer-
* name: Cache Android SDK & NDK
uses: actions/cache@v4
with:
path: ~/.android
key: ${{ runner.os }}-android-sdk
restore-keys: |
${{ runner.os }}-android-sdk-
* name: Install Buildozer & Cython
run: |
pip install --upgrade pip
pip install buildozer cython virtualenv
* name: Build APK with Buildozer
run: |
buildozer android debug
id: build
* name: Upload APK Artifact
uses: actions/upload-artifact@v4
if: success()
with:
name: Superior-Solomon-APK
path: bin/*.apk
* name: Upload Superior-Solomon-Build-Log
uses: actions/upload-artifact@v4
if: always()
with:
name: Superior-Solomon-Build-Log
path: .buildozer/android/platform/build-*/build.log
if-no-files-found: ignore
