name: Build Superior Solomon Calculator APK

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Verify project files
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Project files:"
          ls -la "$GITHUB_WORKSPACE"

          echo "Checking main.py..."
          test -f "$GITHUB_WORKSPACE/main.py"
          echo "main.py FOUND successfully."

      - name: Create buildozer.spec
        run: |
          cat > "$GITHUB_WORKSPACE/buildozer.spec" <<'EOF'
          [app]

          title = Superior Solomon Scientific Calculator
          package.name = superiorsolomoncalculator
          package.domain = com.siyomacodingprograms

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas

          version = 0.1

          requirements = python3,kivy

          orientation = portrait
          fullscreen = 0

          android.api = 35
          android.minapi = 21
          android.ndk = 28c
          android.ndk_api = 21

          android.archs = arm64-v8a

          p4a.bootstrap = sdl2

          android.allow_backup = True

          android.permissions = INTERNET

          log_level = 2
          EOF

          echo "buildozer.spec created."

      - name: Clean Buildozer
        run: |
          rm -rf "$GITHUB_WORKSPACE/.buildozer"
          rm -rf "$GITHUB_WORKSPACE/bin"

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: |
          buildozer -v android debug

      - name: Find APK
        if: success()
        run: |
          echo "Searching for APK..."
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Superior-Solomon-Calculator-APK
          path: ${{ github.workspace }}/bin/*.apk
          if-no-files-found: error
